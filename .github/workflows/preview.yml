name: PR Preview Environment

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy PR Preview
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy preview to Vercel
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy \
            --prebuilt \
            --meta github-pr=${{ github.event.pull_request.number || 0 }} \
            --meta github-repo=${{ github.repository }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Create stable alias for this PR
        id: alias
        if: github.event_name == 'pull_request'
        run: |
          PREVIEW_ALIAS="pr-${{ github.event.pull_request.number }}-${{ github.event.repository.name }}.vercel.app"
          vercel alias set \
            "${{ steps.deploy.outputs.preview_url }}" \
            "$PREVIEW_ALIAS" \
            --token=${{ secrets.VERCEL_TOKEN }}
          echo "alias_url=https://$PREVIEW_ALIAS" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vercel-preview
          message: |
            Preview environment is ready.

            Preview URL: ${{ steps.alias.outputs.alias_url || steps.deploy.outputs.preview_url }}

  cleanup-preview:
    name: Cleanup PR Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Remove stable alias for closed PR
        run: |
          PREVIEW_ALIAS="pr-${{ github.event.pull_request.number }}-${{ github.event.repository.name }}.vercel.app"
          vercel alias remove "$PREVIEW_ALIAS" --yes --token=${{ secrets.VERCEL_TOKEN }} || true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Update PR comment after cleanup
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vercel-preview
          message: |
<<<<<<< HEAD
            Preview environment has been cleaned up for this closed PR.
=======
            Preview environment has been cleaned up for this closed PR.
>>>>>>> d78674775e071b9c73c9a8262476d05bb9863eb4
